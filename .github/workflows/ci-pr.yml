name: CI PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Pushes to main are handled by deploy-production.yml, which runs the same
  # validate steps before triggering deploys. Running both here would just
  # duplicate work and burn CI minutes.

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nextjsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nextjsdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nextjsdb
      RESEND_API_KEY: ci_resend_placeholder_key
      EMAIL_FROM: Online Store <no-reply@example.com>
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CACHE_REVALIDATE_SECRET: ci_cache_revalidate_secret_1234567890
      CRON_SECRET: ci_cron_secret_1234567890
      CSP_REPORT_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: see deploy-production.yml — AdminJS's peer
        # ranges conflict with this app's react/@prisma/client versions.
        # --include=dev: NODE_ENV=production (set above) makes npm ci skip
        # devDependencies by default, but lint/test/build below all need them
        # (tsc, eslint, vitest/jest, etc.) — same reason deploy-production.yml
        # passes it too.
        run: npm ci --legacy-peer-deps --include=dev

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
