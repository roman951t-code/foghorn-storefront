name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: AdminJS's design-system/prisma packages pin peer
        # ranges (react@^18, @prisma/client@^5||^6) that conflict with this
        # app's react@19/@prisma/client@7 — same reason deploy-production.yml
        # needs it. Without the flag, npm ci fails to resolve peers and this
        # job never gets past dependency install (was failing on every run).
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (high+)
        run: npm audit --audit-level=high

      - name: Run Snyk test (if token configured)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
